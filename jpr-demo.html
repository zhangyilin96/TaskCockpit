<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Project OS のJPR向け架空デモ。通常版とは独立したローカルWorkspaceを使用します。" />
    <meta name="application-name" content="JPR向けデモ / Project OS" />
    <title>JPR向けデモ · Project OS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-app-page="jpr-demo">
    <main class="empty-state"><div class="empty-state-inner"><span class="empty-icon">J</span><p>JPR向けデモを読み込んでいます…</p></div></main>
    <script type="module">
      const scriptSources=["storage.js","lifecycle.js","planning.js","bootstrap.js","ai-workflow.js","inspiration-orbs.js","app.js"];
      try{
        const response=await fetch(new URL("index.html",window.location.href));
        if(!response.ok)throw new Error(`shell ${response.status}`);
        const sourceDocument=new DOMParser().parseFromString(await response.text(),"text/html");
        sourceDocument.querySelectorAll("script").forEach(script=>script.remove());
        document.body.innerHTML=sourceDocument.body.innerHTML;
        document.body.dataset.appPage="jpr-demo";
        for(const source of scriptSources){
          await new Promise((resolve,reject)=>{
            const script=document.createElement("script");script.src=new URL(source,window.location.href).href;script.onload=resolve;script.onerror=reject;document.body.appendChild(script);
          });
        }
      }catch(error){
        console.error("JPRデモの読み込みに失敗しました",error);
        document.body.innerHTML='<main class="empty-state"><div class="empty-state-inner"><span class="empty-icon">!</span><h1>デモを読み込めませんでした</h1><p>ページを再読み込みしてください。</p><a class="text-button button-link" href="./index.html">通常版を開く</a></div></main>';
      }
    </script>
  </body>
</html>
